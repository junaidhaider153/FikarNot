<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FikarNot — thoughtful everyday products." />
    <meta name="theme-color" content="#17150F" />
    <meta name="robots" content="index, follow" />
    <!--
      Content-Security-Policy notes:
      - Delivered via <meta>. __SUPABASE_ORIGIN__ is replaced at build/dev time with the
        origin of VITE_SUPABASE_URL (see vite.config.js), so each environment
        (production, staging) allows only its own Supabase project.
      - frame-ancestors (clickjacking protection) is IGNORED in <meta> CSPs, so it is
        sent as a real response header from vercel.json instead.
      - style-src needs 'unsafe-inline' because the app uses React inline styles
        (style={{...}}) extensively; removing that is a larger refactor.
      - img-src includes image.qwenlm.ai for the seeded demo catalogue only — remove it
        once real product photography is uploaded to Supabase Storage.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https://image.qwenlm.ai __SUPABASE_ORIGIN__; media-src 'self' __SUPABASE_ORIGIN__; connect-src 'self' __SUPABASE_ORIGIN__; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="canonical" href="https://www.fikarnot.shop/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FikarNot" />
    <meta property="og:title" content="FikarNot — Everyday Products" />
    <meta property="og:description" content="FikarNot — thoughtful everyday products." />
    <meta property="og:url" content="https://www.fikarnot.shop/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FikarNot — Everyday Products" />
    <meta name="twitter:description" content="FikarNot — thoughtful everyday products." />

    <title>FikarNot — Everyday Products</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
