<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FikarNot — thoughtful everyday products." />
    <meta name="theme-color" content="#17150F" />
    <meta name="robots" content="index, follow" />
    <!--
      Content-Security-Policy notes:
      - Delivered via <meta> because the Node API server never serves this HTML file
        (it's API-only); a CSP response header set there would have no effect on the
        page. If you later put this behind a server/CDN that serves the HTML, prefer
        setting this as a real response header instead — it supports frame-ancestors
        and report-to, which <meta> cannot.
      - style-src needs 'unsafe-inline' because the app uses React inline styles
        (style={{...}}) extensively; removing that requires migrating those to
        classes, which is a larger refactor.
      - img-src includes image.qwenlm.ai for the seeded demo catalogue only — remove
        it once real product photography (served from /uploads via this app) replaces
        the demo images.
      - connect-src is 'self' because the API is same-origin by default. If you set
        VITE_API_URL to a different origin, add that origin here too.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://jsdelivr.net; font-src 'self' https://jsdelivr.net data:; img-src 'self' data: blob: https://qwenlm.ai https://fikarnot-production.up.railway.app; connect-src 'self' https://fikarnot-production.up.railway.app; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="canonical" href="https://www.fikarnot.shop/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FikarNot" />
    <meta property="og:title" content="FikarNot — Everyday Products" />
    <meta property="og:description" content="FikarNot — thoughtful everyday products." />
    <meta property="og:url" content="https://www.fikarnot.shop/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FikarNot — Everyday Products" />
    <meta name="twitter:description" content="FikarNot — thoughtful everyday products." />

    <title>FikarNot — Everyday Products</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
