name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Build
        env:
          # Placeholder: CI never talks to your real project.
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every Edge Function
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
      - name: Test Edge Functions
        run: deno test --allow-env --env-file=supabase/functions/tests/test.env --config supabase/functions/deno.json supabase/functions/tests

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Stub the Supabase-managed pieces (roles, auth/storage schemas)
        run: |
          psql -v ON_ERROR_STOP=1 -c "create database ci"
          psql -v ON_ERROR_STOP=1 -d ci -f supabase/tests/ci_stub.sql
      - name: Apply all migrations in order
        run: |
          for f in supabase/migrations/*.sql; do echo "== $f"; psql -v ON_ERROR_STOP=1 -q -d ci -f "$f"; done
      - name: Re-apply the idempotent migrations (must be safe to repeat)
        run: |
          for f in supabase/migrations/*.sql; do
            case "$f" in
              */0001_*|*/0002_*|*/0003_*) continue ;;
            esac
            echo "== reapply $f"
            psql -v ON_ERROR_STOP=1 -q -d ci -f "$f"
          done
      - name: Database assertions (RLS lockdown, checkout, coupons, cancel, rate limit)
        run: psql -v ON_ERROR_STOP=1 -d ci -f supabase/tests/assertions.sql
